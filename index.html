];

/* ============================= GROUP ADMIN (Ref) PORTAL ============================= */
function renderRefPortal(ref){
  const rows = refMemberRows(ref);
  const groups = [];
  rows.forEach(r=>{
    let g = groups.find(x=>x.chit.id===r.chit.id);
    if(!g){ g = {chit:r.chit, items:[]}; groups.push(g); }
    g.items.push(r);
  });
  let view = ui.refView;
  if(view!=='dashboard' && !groups.some(g=>g.chit.id===view)) view = 'dashboard';

  const curKey = currentMonthKey();
  const monthMap = {};
  const add = (mk,k,v)=>{ const o = monthMap[mk] || (monthMap[mk] = {received:0,late:0,pending:0,cash:0,upi:0,chitPaid:0}); o[k] += v; };
  let pendingTotal = 0, pendingCount = 0;
  const taken = [], notTaken = [];
  rows.forEach(({chit, member, person})=>{
    const mAmt = monthlyAmount(chit);
    if(!member.isOrg){
      Object.keys(member.payments||{}).forEach(mk=>{
        const st = member.payments[mk];
        if(st==='paid' || st==='late'){
          add(mk,'received',mAmt);
          if(st==='late') add(mk,'late',mAmt);
          const mode = (member.payModes||{})[mk];
          if(mode==='cash') add(mk,'cash',mAmt); else if(mode==='upi') add(mk,'upi',mAmt);
        } else if(st==='pending'){
          add(mk,'pending',mAmt); pendingTotal += mAmt; pendingCount++;
        }
      });
    }
    const won = (member.slots||[]).filter(s=>s.takenChitNo);
    if(won.length===0) notTaken.push({chit, member, person});
    won.forEach(s=>{
      const mk = addMonths(chit.startMonth, Number(s.takenChitNo)-1);
      const amount = Number(s.chitTakenAmount) || payoutForMonth(chit, Number(s.takenChitNo)-1, mk);
      taken.push({chit, member, person, slot:s, mk, amount});
      if(s.payoutStatus==='paid') add(mk,'chitPaid',amount);
    });
  });
  taken.sort((a,b)=> a.chit.name.localeCompare(b.chit.name) || Number(a.slot.takenChitNo)-Number(b.slot.takenChitNo));
  const peopleCount = new Set(rows.map(r=>r.person.id)).size;

  const pills = `<div class="portal-nav">
      <button class="${view==='dashboard'?'active':''}" data-ref-view="dashboard">Dashboard</button>
      ${groups.map(g=>`<button class="${view===g.chit.id?'active':''}" data-ref-view="${g.chit.id}">${escapeHtml(chitLabel(g.chit))}</button>`).join('')}
    </div>`;
  const dash = n => n ? fmt(n) : '<span style="color:var(--ink-soft);">—</span>';
  const toggleBtn = `<button class="btn ghost small" data-ref-toggle="1">${ui.refShowAll ? 'Show recent 3 months' : 'Show all months'}</button>`;

  let bodyHtml;
  if(view==='dashboard'){
    const thisMonth = monthMap[curKey] || {received:0};
    const window3 = [addMonths(curKey,-2), addMonths(curKey,-1), curKey];
    const monthKeys = ui.refShowAll ? Array.from(new Set([...Object.keys(monthMap), ...window3])).sort() : window3;
    const monthRows = monthKeys.map(mk=>{
      const o = monthMap[mk] || {received:0,late:0,pending:0,cash:0,upi:0,chitPaid:0};
      return `<tr><td>${monthLabel(mk)}</td>
        <td class="right num" style="font-weight:600;">${dash(o.received)}</td>
        <td class="right num">${dash(o.late)}</td>
        <td class="right num" style="${o.pending?'color:var(--red);font-weight:600;':''}">${dash(o.pending)}</td>
        <td class="right num">${dash(o.cash)}</td>
        <td class="right num">${dash(o.upi)}</td>
        <td class="right num">${dash(o.chitPaid)}</td></tr>`;
    }).join('');
    const takenRows = taken.map(t=>{
      const paid = t.slot.payoutStatus==='paid';
      const modeTxt = t.slot.payoutMode==='upi' ? 'UPI' : t.slot.payoutMode==='cash' ? 'Cash' : '';
      return `<tr>
        <td><b>${escapeHtml(t.person.name)}</b>${t.member.isOrg ? ' <span class="badge">Kovil</span>' : ''}</td>
        <td>${escapeHtml(t.chit.name)}</td>
        <td class="right num">${t.slot.takenChitNo}</td>
        <td>${monthLabel(t.mk)}</td>
        <td class="right num">${fmt(t.amount)}</td>
        <td><button class="btn ghost small" data-payout="1" data-chit="${t.chit.id}" data-member="${t.member.id}" data-slot="${t.slot.id}">${paid ? `<span class="badge pos">Paid${modeTxt ? ' · '+modeTxt : ''}</span>` : '<span class="badge neg">Not paid</span>'}</button></td>
      </tr>`;
    }).join('');
    const notTakenRows = notTaken.map(t=>{
      const unpaid = t.member.isOrg ? 0 : Object.values(t.member.payments||{}).filter(v=>v==='pending').length;
      return `<tr><td><b>${escapeHtml(t.person.name)}</b></td><td>${escapeHtml(t.chit.name)}</td><td class="right">${unpaid>0?`<span class="badge neg">${unpaid}</span>`:'0'}</td></tr>`;
    }).join('');
    bodyHtml = `
      <div class="stat-row">
        <div class="stat"><div class="label">My Members</div><div class="value">${peopleCount}</div></div>
        <div class="stat"><div class="label">Received This Month</div><div class="value">${fmt(thisMonth.received)}</div></div>
        <div class="stat"><div class="label">Pending Dues</div><div class="value ${pendingTotal>0?'neg':'pos'}">${fmt(pendingTotal)}</div>${pendingCount>0 ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${pendingCount} unpaid month${pendingCount>1?'s':''}</div>` : ''}</div>
        <div class="stat"><div class="label">Chits Taken</div><div class="value">${taken.length}</div></div>
      </div>
      <div class="card">
        <div class="toolbar"><h3 style="margin:0;">Month-wise collection</h3><span style="flex:1;"></span>${toggleBtn}</div>
        <div class="table-scroll"><table>
          <thead><tr><th>Month</th><th class="right">Received</th><th class="right">Late paid</th><th class="right">Pending</th><th class="right">Cash</th><th class="right">UPI</th><th class="right">Chit paid out</th></tr></thead>
          <tbody>${monthRows}</tbody>
        </table></div>
        <div class="legend"><span style="color:var(--ink-soft);">Built automatically from the payment marks in your group pages. Received includes late payments; Cash / UPI come from how each payment was recorded.</span></div>
      </div>
      <div class="card">
        <h3>Chit taken (${taken.length})</h3>
        <div class="table-scroll"><table>
          <thead><tr><th>Member</th><th>Group</th><th class="right">Chit no.</th><th>Month</th><th class="right">Amount</th><th>Payout</th></tr></thead>
          <tbody>${takenRows || `<tr><td colspan="6" style="text-align:center;color:var(--ink-soft);padding:16px;">No chit taken yet.</td></tr>`}</tbody>
        </table></div>
        <div class="legend"><span style="color:var(--ink-soft);">Tap the Payout status to record that the chit money was paid — by Cash or UPI. Once recorded as paid it is locked.</span></div>
      </div>
      <div class="card">
        <h3>Chit not taken (${notTaken.length})</h3>
        <div class="table-scroll"><table>
          <thead><tr><th>Member</th><th>Group</th><th class="right">Unpaid months</th></tr></thead>
          <tbody>${notTakenRows || `<tr><td colspan="3" style="text-align:center;color:var(--ink-soft);padding:16px;">Everyone has taken a chit.</td></tr>`}</tbody>
        </table></div>
      </div>`;
  } else {
    const g = groups.find(x=>x.chit.id===view);
    const months = [];
    for(let i=0;i<g.chit.durationMonths;i++) months.push(addMonths(g.chit.startMonth, i));
    const vis = visibleMonthKeys(months, ui.refShowAll);
    const head = vis.map(mk=>`<th class="right">${monthLabel(mk)}</th>`).join('');
    const body = g.items.slice().sort((a,b)=>(a.member.isOrg?1:0)-(b.member.isOrg?1:0) || a.person.name.localeCompare(b.person.name)).map(({member, person})=>{
      const chips = (member.slots||[]).filter(s=>s.takenChitNo).map(s=>`<span class="badge" style="background:var(--gold-soft);color:var(--ink);margin:0 4px 4px 0;">No ${s.takenChitNo}</span>`).join('') || '<span style="color:var(--ink-soft);font-size:11.5px;">Not taken</span>';
      const cells = member.isOrg
        ? `<td colspan="${vis.length}" style="color:var(--ink-soft);font-size:12px;white-space:normal;min-width:150px;">Kovil seat — no monthly payment</td>`
        : vis.map(mk=>`<td>${payCellHtml(g.chit, member, mk)}</td>`).join('');
      return `<tr>
        <td style="min-width:130px;"><b>${escapeHtml(person.name)}</b></td>
        <td style="min-width:90px;">${chips}</td>
        ${cells}
        <td style="min-width:140px;"><input class="cell-input" data-ref-note="1" data-chit="${g.chit.id}" data-member="${member.id}" value="${escapeAttr(member.note||'')}" placeholder="Note"/></td>
      </tr>`;
    }).join('');
    bodyHtml = `
      <div class="card">
        <div class="toolbar"><h3 style="margin:0;">${escapeHtml(chitLabel(g.chit))}</h3><span style="flex:1;"></span>${months.length>3 ? toggleBtn : ''}</div>
        <div class="table-scroll"><table>
          <thead><tr><th>Member</th><th>Chit</th>${head}<th>Note</th></tr></thead>
          <tbody>${body}</tbody>
        </table></div>
        <div class="legend"><span style="color:var(--ink-soft);">Tap a cell to record how it was collected — Cash or UPI — or mark it not collected yet. Collected entries are locked (only the portal admin can change them). Notes can be edited.</span></div>
      </div>`;
  }

  return `
    <div style="max-width:900px;width:100%;margin:0 auto;padding:20px 16px 60px;">
      ${roleBarHtml('group')}
      <div class="topbar">
        <div><h2>Group Admin</h2><div class="sub">${escapeHtml(ref.name)} — ${peopleCount} member${peopleCount===1?'':'s'} in ${groups.length} chit group${groups.length===1?'':'s'}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;"><button class="btn" id="btnRefAddPerson">+ Add person</button><button class="btn" id="btnRefRemind">&#128276; Remind pending</button><button class="btn" data-enable-reminders="1">&#128276; Reminders</button><button class="btn" id="btnRefSignOut">Sign Out</button></div>
      </div>
      ${pills}
      ${groups.length ? bodyHtml : `<div class="empty-state"><div class="mark-big">&#3495;</div><p>No members are assigned to you yet.</p></div>`}
    </div>`;
}

function attachRefPortalEvents(){
  attachRoleEvents(); attachNotifyEvents();
  document.getElementById('btnRefAddPerson')?.addEventListener('click', ()=> openModal('refAddPerson', null, {}));
  document.getElementById('btnRefRemind')?.addEventListener('click', ()=>{
    const ref = findRefByPortalEmail(currentUser.email);
    if(!ref) return;
    const {targets, noEmail} = reminderTargets('ref:'+ref.name);
    if(!targets.length){
      notify(noEmail ? 'Members with pending dues have no login email yet, so they cannot get reminders. Ask the portal admin to add their emails on the People page.' : 'None of your members have pending dues — nothing to remind.');
      return;
    }
    askConfirm('Send a reminder to '+targets.length+' of your member'+(targets.length===1?'':'s')+' with pending dues?'+(noEmail ? '\n\n'+noEmail+' more have no login email and will be skipped.' : ''), ()=>{
      sendRemindersNow('Chit reminder', DEFAULT_REMINDER, targets);
    }, 'Send reminders');
  });
  document.getElementById('btnRefSignOut')?.addEventListener('click', ()=> signOut(auth));
  document.querySelectorAll('[data-ref-view]').forEach(el=>{
    el.addEventListener('click', ()=>{ ui.refView = el.dataset.refView; render(); window.scrollTo(0,0); });
  });
  document.querySelectorAll('[data-ref-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{ ui.refShowAll = !ui.refShowAll; render(); });
  });
  document.querySelectorAll('[data-cell]').forEach(el=>{
    el.addEventListener('click', ()=> collectCell(el.dataset.chit, el.dataset.member, el.dataset.month));
  });
  document.querySelectorAll('[data-ref-note]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const chit = state.chits.find(c=>c.id===el.dataset.chit);
      const m = chit && chit.members.find(x=>x.id===el.dataset.member);
      if(m){ m.note = el.value; scheduleSave(); }
    });
  });
  document.querySelectorAll('[data-payout]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const chit = state.chits.find(c=>c.id===el.dataset.chit);
      const m = chit && chit.members.find(x=>x.id===el.dataset.member);
      const slot = m && (m.slots||[]).find(x=>x.id===el.dataset.slot);
      if(!slot) return;
      if(slot.payoutStatus==='paid'){
        notify('This chit payout is already recorded as paid'+(slot.payoutMode ? ' by '+(slot.payoutMode==='upi' ? 'UPI' : 'Cash') : '')+'.\n\nIt is locked for group admins — ask the portal admin to change it.');
        return;
      }
      openModal('payoutStatus', el.dataset.chit, {memberId:el.dataset.member, slotId:el.dataset.slot});
    });
  });
  document.querySelectorAll('[data-ref-markall]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const ref = findRefByPortalEmail(currentUser.email);
      if(!ref) return;
      const chitId = el.dataset.refMarkall, mk = el.dataset.month;
      const targets = refMemberRows(ref).filter(r=>r.chit.id===chitId && !r.member.isOrg && r.member.payments[mk]!=='paid' && r.member.payments[mk]!=='late').map(r=>r.member);
      if(!targets.length){ notify('Everyone of yours is already marked paid (or late-paid) for '+monthLabel(mk)+'.'); return; }
      askConfirm('Mark '+targets.length+' of your member(s) as Paid for '+monthLabel(mk)+'?', ()=>{
        targets.forEach(m=>{ m.payments[mk] = 'paid'; });
        scheduleSave();
      }, 'Mark paid');
    });
  });
}

function renderReports(){
  if(state.chits.length===0){
    return `<div class="topbar"><div><h2>Reports</h2></div></div>
      <div class="empty-state"><div class="mark-big">&#3495;</div><p>No chit groups yet. Create one from the sidebar.</p></div>`;
  }
  const tabs = REPORT_TABS.map(t=>`
    <button class="btn ${ui.reportTab===t.id?'primary':''} small" data-report-tab="${t.id}">${t.label}</button>
  `).join('');

  let body = '';
  if(ui.reportTab==='month') body = renderReportMonth();
  else if(ui.reportTab==='chit') body = renderReportChitWise();
  else if(ui.reportTab==='person') body = renderPeople();
  else if(ui.reportTab==='pending') body = renderReportPending();
  else if(ui.reportTab==='distribution') body = renderReportDistribution();
  else if(ui.reportTab==='nontaker') body = renderReportNonTaker();
  else if(ui.reportTab==='denom') body = renderReportDenomination();

  return `
    <div class="topbar"><div><h2>Reports</h2><div class="sub">Every angle on the temple's chit funds — by month, by group, by person, and by outstanding dues</div></div></div>
    <div class="toolbar" style="margin-bottom:16px;">${tabs}</div>
    ${body}
  `;
}

function renderReportMonth(){
  const months = allMonthsUnion();
  if(months.length===0) return `<div class="empty-state"><p>No months to report on yet.</p></div>`;
  if(!ui.reportMonth || !months.includes(ui.reportMonth)){
    ui.reportMonth = months[months.length-1];
  }
  const mk = ui.reportMonth;

  const monthOptions = months.map(m=>`<option value="${m}" ${m===mk?'selected':''}>${monthLabel(m)}</option>`).join('');

  let totalOpening=0,totalCollection=0,totalPendingRecv=0,totalTotalCollection=0,totalChitPaid=0,totalClosing=0;
  const groupRows = [];
  const paymentRows = [];
  state.chits.forEach(c=>{
    const rows = chitLedger(c);
    const row = rows.find(r=>r.monthKey===mk);
    if(!row) return;
    totalOpening+=row.opening; totalCollection+=row.collection; totalPendingRecv+=row.pendingReceived;
    totalTotalCollection+=row.totalCollection; totalChitPaid+=row.chitPaid; totalClosing+=row.closing;
    groupRows.push(`<tr>
      <td><button class="btn ghost small" data-nav="chit" data-id="${c.id}">${escapeHtml(chitLabel(c))}</button></td>
      <td class="right num">${fmt(row.opening)}</td>
      <td class="right num">${fmt(row.collection)}</td>
      <td class="right num">${fmt(row.pendingReceived)}</td>
      <td class="right num" style="font-weight:600;">${fmt(row.totalCollection)}</td>
      <td class="right num">${fmt(row.chitPaid)}</td>
      <td class="right num" style="font-weight:700;">${fmt(row.closing)}</td>
    </tr>`);
    c.members.forEach(m=>{
      if(m.isOrg) return;
      const st = m.payments[mk];
      if(!st) return;
      paymentRows.push({group:c.name, name:personName(m.personId), refBy:personRefBy(m.personId), status:st, amount:monthlyAmount(c)});
    });
  });
  const statusLabel = {paid:'Paid', pending:'Pending', late:'Late-paid'};
  const statusBadge = {paid:'pos', pending:'neg', late:''};
  const payHtml = paymentRows.length ? paymentRows.map(r=>`
    <tr>
      <td>${escapeHtml(r.group)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.refBy||'')}</td>
      <td><span class="badge ${statusBadge[r.status]||''}" style="${r.status==='late'?'background:var(--blue-soft);color:var(--blue);':''}">${statusLabel[r.status]||r.status}</span></td>
      <td class="right num">${fmt(r.amount)}</td>
    </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);padding:16px;">No payment activity recorded for this month.</td></tr>`;

  return `
    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0;">Month</h3>
        <select id="reportMonthSelect" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;">${monthOptions}</select>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="label">Total Collection</div><div class="value">${fmt(totalTotalCollection)}</div></div>
        <div class="stat"><div class="label">Total Chit Paid</div><div class="value">${fmt(totalChitPaid)}</div></div>
        <div class="stat"><div class="label">Net Closing</div><div class="value ${totalClosing<0?'neg':'pos'}">${fmt(totalClosing)}</div></div>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Chit Group</th><th class="right">Opening</th><th class="right">Collection</th><th class="right">Pending Recv.</th><th class="right">Total Collection</th><th class="right">Chit Paid</th><th class="right">Closing</th></tr></thead>
          <tbody>${groupRows.join('') || `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:16px;">No chit group is active this month.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h3>Payments in ${monthLabel(mk)}</h3>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Chit Group</th><th>Member</th><th>Ref By</th><th>Status</th><th class="right">Amount</th></tr></thead>
          <tbody>${payHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderReportChitWise(){

      <tr>
        <td>${r.idx}</td><td>${monthLabel(r.monthKey)}</td>
        <td class="right num">${fmt(r.opening)}</td><td class="right num">${fmt(r.collection)}</td>
        <td class="right num">${fmt(r.pendingReceived)}</td><td class="right num" style="font-weight:600;">${fmt(r.totalCollection)}</td>
        <td class="right num">${fmt(r.chitPaid)}</td><td class="right num" style="font-weight:700;${r.closing<0?'color:var(--red);':''}">${fmt(r.closing)}</td>

    return `
      <div class="card">
        <div class="toolbar">
          <h3 style="margin:0;">${escapeHtml(chitLabel(c))}</h3>

          <table>

function renderReportPending(){
  const items = [];
  state.chits.forEach(c=>{
    const mAmt = monthlyAmount(c);
    c.members.forEach(m=>{
      if(m.isOrg) return;
      Object.keys(m.payments||{}).forEach(mk=>{
        if(m.payments[mk]==='pending'){
          items.push({group:c.name, name:personName(m.personId), refBy:personRefBy(m.personId), month:mk, amount:mAmt});
        }
      });
    });
  });
  items.sort((a,b)=> a.month<b.month?-1:a.month>b.month?1: a.group.localeCompare(b.group));
  const total = items.reduce((s,i)=>s+i.amount,0);
  const rows = items.map(i=>`
    <tr>
      <td>${monthLabel(i.month)}</td>
      <td>${escapeHtml(i.group)}</td>
      <td>${escapeHtml(i.name)}</td>

    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0;">Pending / Unpaid Instalments</h3>

        <span class="badge neg" style="font-size:13px;padding:5px 12px;">${items.length} due · ${fmt(total)}</span>

        </table>

  `;
}

function allMonthsUnion(){
  if(state.chits.length===0) return [];
  let minMonth=null, maxMonth=null;
  state.chits.forEach(c=>{
    const end = addMonths(c.startMonth, c.durationMonths-1);
    if(!minMonth || c.startMonth<minMonth) minMonth=c.startMonth;
    if(!maxMonth || end>maxMonth) maxMonth=end;
  });
  if(!minMonth) return [];
  const span = monthDiff(minMonth,maxMonth)+1;
  const months = [];
  for(let i=0;i<span;i++) months.push(addMonths(minMonth,i));
  return months;
}

function renderDashboard(){
  if(activeChits().length===0){
    return `<div class="topbar"><div><h2>Temple Dashboard</h2><div class="sub">Combined cash flow across every chit group</div></div></div>
      <div class="empty-state"><div class="mark-big">&#3495;</div><p>${activeChits().length ? 'All chit groups are closed.' : 'No chit groups yet. Create one from the sidebar.'}</p></div>${renderClosedGroupsCard()}`;
  }
  const months = allMonthsUnion();

  const perChitLedger = {};
  activeChits().forEach(c=>{ perChitLedger[c.id] = chitLedger(c); });

  const agg = months.map(mk=>{
    let opening=0, collection=0, pendingRec=0, totalCollection=0, chitPaid=0, closing=0, any=false;
    activeChits().forEach(c=>{
      const rows = perChitLedger[c.id];
      const row = rows.find(r=>r.monthKey===mk);
      if(row){ any=true; opening+=row.opening; collection+=row.collection; pendingRec+=row.pendingReceived; totalCollection+=row.totalCollection; chitPaid+=row.chitPaid; closing+=row.closing; }
    });
    return {mk, opening, collection, pendingRec, totalCollection, chitPaid, closing, any};
  }).filter(r=>r.any);

  const latest = agg[agg.length-1];
  const totalMembers = activeChits().reduce((s,c)=>s+c.members.length,0);
  const totalPendingDues = activeChits().reduce((s,c)=>{
    const rows = chitLedger(c);
    return s + rows.reduce((s2,r)=>s2+r.outstanding,0);
  },0);

  const statCards = `
    <div class="stat-row">
      <div class="stat"><div class="label">Active Chit Groups</div><div class="value">${activeChits().length}</div></div>
      <div class="stat"><div class="label">Total Members Enrolled</div><div class="value">${totalMembers}</div></div>
      <div class="stat"><div class="label">Latest Closing Balance</div><div class="value ${latest&&latest.closing<0?'neg':'pos'}">${latest?fmt(latest.closing):'₹0'}</div></div>
      <div class="stat"><div class="label">Outstanding Dues (unpaid)</div><div class="value ${totalPendingDues>0?'neg':''}">${fmt(totalPendingDues)}</div></div>
    </div>`;

  const recentWindow = [addMonths(currentMonthKey(),-2), addMonths(currentMonthKey(),-1), currentMonthKey()];
  const visibleAgg = ui.dashboardExpanded ? agg : agg.filter(r=>recentWindow.includes(r.mk));

  const rows = visibleAgg.map(r=>`
    <tr>
      <td>${monthLabel(r.mk)}</td>
      <td class="right num">${fmt(r.opening)}</td>
      <td class="right num">${fmt(r.collection)}</td>
      <td class="right num">${fmt(r.pendingRec)}</td>
      <td class="right num" style="font-weight:600;">${fmt(r.totalCollection)}</td>
      <td class="right num">${fmt(r.chitPaid)}</td>
      <td class="right num" style="font-weight:700;">${fmt(r.closing)}</td>
    </tr>`).join('');

  return `
    <div class="topbar">
      <div><h2>Temple Dashboard</h2><div class="sub">Combined cash flow across every chit group — mirrors the workbook's "Summary DB" tab</div></div>
    </div>
    ${renderReadyToCloseCard()}
    ${statCards}
    ${renderClosedGroupsCard()}
    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0;">${ui.dashboardExpanded ? 'All-Chit Monthly Ledger — full history' : 'All-Chit Monthly Ledger — last 3 months'}</h3>
        <span style="flex:1;"></span>
        <button class="btn ghost small" id="btnToggleDashboardHistory">${ui.dashboardExpanded ? 'Show Last 3 Months' : 'Show Full History'}</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th class="sticky-col">Month</th><th class="right">Opening Balance</th><th class="right">Chit Collection</th>
            <th class="right">Pending Received</th><th class="right">Total Collection</th><th class="right">Chit Paid</th><th class="right">Closing Balance</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="legend"><span style="color:var(--ink-soft);">Looking for a specific month? Check the Reports page → Month-wise, which covers every month with a picker.</span></div>
    </div>
    <div class="card">
      <h3>Per-Group Snapshot</h3>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Chit Group</th><th class="right">Value</th><th class="right">Members</th><th class="right">Monthly Amt</th><th class="right">Latest Closing</th></tr></thead>
          <tbody>
          ${activeChits().map(c=>{
            const rows2 = chitLedger(c);
            const last = rows2[rows2.length-1];
            return `<tr>
              <td><button class="btn ghost small" data-nav="chit" data-id="${c.id}">${escapeHtml(chitLabel(c))}</button></td>
              <td class="right num">${fmt(c.chitValue)}</td>

              <td class="right num">${fmt(monthlyAmount(c))}</td>
              <td class="right num ${last&&last.closing<0?'neg':''}">${last?fmt(last.closing):'—'}</td>

function renderChitView(chit){
  const ledger = chitLedger(chit);

  const last = ledger[ledger.length-1];
  const totalOutstanding = ledger.reduce((s,r)=>s+r.outstanding,0);

  const months = ledger.map(r=>r.monthKey);
  // By default show only the previous 2 months + the current month; closed months
  // stay hidden until "Show all months" is tapped. (Unpaid counts still cover every month.)
  let visibleMonths = months;
  if(!ui.showAllMonths && months.length>3){
    const curKey = currentMonthKey();
    let ci = months.indexOf(curKey);
    if(ci===-1) ci = curKey < months[0] ? 2 : months.length-1;
    const startIdx = Math.max(0, ci-2);
    visibleMonths = months.slice(startIdx, startIdx+3);

  const memberPersonIds = new Set(chit.members.map(m=>m.personId));

function cyclePayment(chitId, memberId, monthKey){
  const chit = state.chits.find(c=>c.id===chitId);
  const m = chit.members.find(x=>x.id===memberId);
  const cur = m.payments[monthKey] || '';
  if(cur===''){
    // Quick path: a blank cell becomes Paid with one tap.
    m.payments[monthKey] = 'paid';
    scheduleSave(); render();
    return;
  }
  // Already marked: let the admin choose exactly what it should be (or clear it).
  openModal('payStatus', chitId, {memberId, monthKey});
}

// Group admin taps a collection cell: record how it was collected. Collected entries are locked for them.
function collectCell(chitId, memberId, monthKey){
  const chit = state.chits.find(c=>c.id===chitId);
  const m = chit && chit.members.find(x=>x.id===memberId);
  if(!m || m.isOrg) return;
  const st = m.payments[monthKey] || '';
  if(st==='paid' || st==='late'){
    const mode = (m.payModes||{})[monthKey];
    notify('Already collected'+(mode ? ' by '+(mode==='upi' ? 'UPI' : 'Cash') : '')+'.\n\nCollections are locked for group admins — ask the portal admin if this needs to be changed.');
    return;
  }
  openModal('collectStatus', chitId, {memberId, monthKey});
}

// In-app confirmation box (browser confirm() can be silently blocked on phones).
function askConfirm(message, onYes, yesLabel, noLabel, onNo){
  openModal('confirm', null, {message, onYes, yesLabel: yesLabel||'Yes', noLabel: noLabel||'Cancel', onNo});
}
// One-button information box.
function notify(message){
  openModal('confirm', null, {message, onYes:null, yesLabel:'OK', noLabel:'Close', info:true});
}
// Ask before an edit is kept; cancelling leaves the data unchanged (the page redraws with the old value).
function confirmChange(title, fromTxt, toTxt, apply){
  askConfirm(title+'\n\n'+(fromTxt!==null && fromTxt!==undefined ? fromTxt+'  →  ' : '')+toTxt, ()=>{ apply(); scheduleSave(); }, 'Save change', 'Keep old');
}
// Is this login e-mail already taken? A person and a group admin MAY share an email
// (a group admin who also takes part in chits), but two people — or two group admins — may not.
function normEmail(e){ return (e||'').trim().toLowerCase(); }
function emailInUse(email, except){
  const lower = normEmail(email);
  if(!lower) return false;
  except = except || {};
  if(except.kind==='ref') return (state.refs||[]).some(r=>r.id!==except.refId && normEmail(r.portalEmail)===lower);
  return state.people.some(p=>p.id!==except.personId && normEmail(p.portalEmail)===lower);
}
// ---- Roles: one login can be portal admin, group admin and member at once ----
function rolesFor(email){
  const person = findPersonByPortalEmail(email);
  const ref = findRefByPortalEmail(email);
  const listed = (state.adminEmails||[]).some(a=>normEmail(a)===normEmail(email));
  return {person, ref, admin: (!person && !ref) || listed};
}
function availableRoles(r){
  const a = [];
  if(r.admin) a.push('admin');
  if(r.ref) a.push('group');
  if(r.person) a.push('member');
  return a;
}
function roleBarHtml(current){
  const avail = availableRoles(rolesFor(currentUser && currentUser.email));
  if(avail.length<2) return '';
  const label = {admin:'Portal Admin', group:'Group Admin', member:'My Chits'};
  return `<div class="portal-nav" style="position:static;margin-bottom:10px;"><span style="font-size:11.5px;color:var(--ink-soft);align-self:center;white-space:nowrap;">View as</span>${avail.map(r=>`<button class="${r===current?'active':''}" data-role="${r}">${label[r]}</button>`).join('')}</div>`;
}
function attachRoleEvents(){
  document.querySelectorAll('[data-role]').forEach(el=>{
    el.addEventListener('click', ()=>{ ui.role = el.dataset.role; ui.sidebarOpen = false; render(); window.scrollTo(0,0); });
  });
}
// Removed members are kept (with their chit numbers and payments) so a mistaken delete can be undone.
function archiveMember(chit, member){
  if(!chit.removed) chit.removed = [];
  chit.removed.push(Object.assign({}, member, {_name: personName(member.personId), _refBy: personRefBy(member.personId), _removedAt: new Date().toISOString()}));
  chit.members = chit.members.filter(m=>m.id!==member.id);
}
function restoreMember(chit, recId){
  const idx = (chit.removed||[]).findIndex(r=>r.id===recId);
  if(idx<0) return null;
  const rec = chit.removed[idx];
  let person = state.people.find(p=>p.id===rec.personId);
  if(!person){
    const id = getOrCreatePerson(rec._name || 'Unnamed');
    person = state.people.find(p=>p.id===id);
    if(person && !person.refBy && rec._refBy) person.refBy = rec._refBy;
  }
  chit.removed.splice(idx,1);
  if(chit.members.some(m=>m.personId===person.id)) return null;      // already back in the group
  const m = Object.assign({}, rec);
  delete m._name; delete m._refBy; delete m._removedAt;
  m.personId = person.id;
  if(chit.members.some(x=>x.sno===m.sno)) m.sno = Math.max(0, ...chit.members.map(x=>x.sno)) + 1;
  chit.members.push(m);
  return m;
}

function setMemberName(m, newName){
  newName = (newName||'').trim();
  if(!newName) newName = 'Unnamed';
  const existing = state.people.find(p=>p.name.toLowerCase()===newName.toLowerCase());
  if(existing){
    m.personId = existing.id;
    return;
  }
  const current = state.people.find(p=>p.id===m.personId);
  if(current){
    current.name = newName;
  } else {
    m.personId = getOrCreatePerson(newName);
  }
}

function addMember(chitId){
  const chit = state.chits.find(c=>c.id===chitId);
  if(!chit) return;
  const sno = chit.members.length ? Math.max(...chit.members.map(m=>m.sno))+1 : 1;
  const personId = getOrCreatePerson('New Member '+sno);
  chit.members.push({id:uid('m'), sno, personId, payments:{}, slots:[], lateFor:{}});
  scheduleSave(); render();
}

function addExistingMembersToChit(chitId, personIds){
  const chit = state.chits.find(c=>c.id===chitId);
  if(!chit) return;
  let sno = chit.members.length ? Math.max(...chit.members.map(m=>m.sno)) : 0;
  personIds.forEach(pid=>{
    if(chit.members.some(m=>m.personId===pid)) return; // already in this group
    const pn = (state.people.find(p=>p.id===pid)||{}).name || '';
    const archived = (chit.removed||[]).find(r=>r.personId===pid || (r._name && nameKey(r._name)===nameKey(pn)));
    if(archived){ restoreMember(chit, archived.id); return; }   // comes back with the same chit numbers
    sno += 1;
    chit.members.push({id:uid('m'), sno, personId:pid, payments:{}, slots:[], lateFor:{}, payModes:{}});
  });
  scheduleSave(); render();
}

/* ============================= BACKUP / RESTORE ============================= */
function downloadCSV(baseName, headers, rows){
  const esc = v => {
    const s = String(v??'');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const lines = [headers.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))];
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `${baseName}-${stamp}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function exportBackup(){
  const payload = JSON.stringify(state, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `chit-ledger-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function importBackup(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.chits)) throw new Error('Not a valid backup file');
      state = parsed;
      migrate();
      scheduleSave();
      ui.view='dashboard'; ui.chitId=null; ui.sidebarOpen=false;
      render();
      alert('Backup restored.');
    }catch(err){
      alert('Could not read that file as a chit ledger backup: '+err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

    document.getElementById('fDuration').addEventListener('input', regenerateTemplate);

        if(!name){ err.textContent = 'Enter a name, or pick an existing person above.'; return; }
        const existing = state.people.find(p=>p.name.toLowerCase()===name.toLowerCase());
        if(existing && inGroup.has(existing.id)){ err.textContent = name+' is already in this group.'; return; }
        const before = state.people.length;
        personId = getOrCreatePerson(name);
        isNew = state.people.length > before;
      }
      const person = state.people.find(p=>p.id===personId);
      const refVal = document.getElementById('amRef').value || '';
      if(person && (refVal || isNew)) person.refBy = refVal;
      // A member who was removed earlier comes back with the same chit numbers and payments.
      const archived = (chit.removed||[]).find(r=>r.personId===personId || (person && r._name && nameKey(r._name)===nameKey(person.name)));
      let member = archived ? restoreMember(chit, archived.id) : null;
      if(!member){
        const sno = chit.members.length ? Math.max(...chit.members.map(m=>m.sno))+1 : 1;
        member = {id:uid('m'), sno, personId, payments:{}, slots:[], lateFor:{}, payModes:{}};
        chit.members.push(member);
      }
      if(document.getElementById('amOrg').checked) setOrgSeat(chit, member, true);
      scheduleSave(); ui.modal = null; render();
    };
  }

  if(ui.modal.type==='renamePerson'){
    const p = state.people.find(x=>x.id===ui.modal.personId);
    container.innerHTML = `
      <div class="modal">
        <h3>Rename person</h3>
        <div class="field"><label>Name</label><input id="rnName" value="${escapeAttr(p ? p.name : '')}"/></div>
        <div id="rnErr" style="color:var(--red);font-size:12.5px;min-height:16px;"></div>
        <div class="modal-actions"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mSave">Save</button></div>
      </div>`;
    document.body.appendChild(container);
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('mSave').onclick = ()=>{
      const name = (document.getElementById('rnName').value||'').trim();
      const err = document.getElementById('rnErr');
      if(!name){ err.textContent = 'Name cannot be empty.'; return; }
      if(state.people.some(x=>x.id!==p.id && x.name.toLowerCase()===name.toLowerCase())){ err.textContent = 'Another person already has this name — pick that person from the list instead.'; return; }
      if(name===p.name){ closeModal(); return; }
      const oldName = p.name;
      ui.modal = null;
      confirmChange('Rename this person everywhere?', oldName, name, ()=>{ p.name = name; });
    };
  }

  if(ui.modal.type==='personEdit'){
    const p = ui.modal.personId ? state.people.find(x=>x.id===ui.modal.personId) : null;
    container.innerHTML = `
      <div class="modal">
        <h3>${p ? 'Edit person' : 'Add person'}</h3>
        <div class="field"><label>Name</label><input id="peName" value="${escapeAttr(p ? p.name : '')}" placeholder="Full name"/></div>
        <div class="field"><label>Ref By</label><select id="peRef">${refOptionsHtml(p ? (p.refBy||'') : '')}</select></div>
        <div class="field"><label>Portal login email (optional)</label><input id="peEmail" type="email" value="${escapeAttr(p ? (p.portalEmail||'') : '')}" placeholder="member's login email"/></div>
        <div id="peErr" style="color:var(--red);font-size:12.5px;min-height:16px;"></div>
        <div class="modal-actions"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mSave">${p ? 'Save changes' : 'Add person'}</button></div>
      </div>`;
    document.body.appendChild(container);
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('mSave').onclick = ()=>{
      const err = document.getElementById('peErr');
      const name = (document.getElementById('peName').value||'').trim();
      const refVal = document.getElementById('peRef').value || '';
      const email = (document.getElementById('peEmail').value||'').trim();
      if(!name){ err.textContent = 'Enter a name.'; return; }
      if(state.people.some(x=>(!p || x.id!==p.id) && x.name.toLowerCase()===name.toLowerCase())){ err.textContent = 'A person with this name already exists — edit that one instead.'; return; }
      if(email && emailInUse(email, {personId: p ? p.id : null})){ err.textContent = 'That login email is already used by another person.'; return; }
      if(!p){
        state.people.push({id:uid('person'), name, refBy:refVal, portalEmail:email});
        scheduleSave(); ui.modal = null; render();
        return;
      }
      ui.modal = null;
      const changes = [];
      if(name!==p.name) changes.push('Name: '+p.name+' → '+name);
      if(refVal!==(p.refBy||'')) changes.push('Ref By: '+(p.refBy||'none')+' → '+(refVal||'none'));
      if(email!==(p.portalEmail||'')) changes.push('Login email: '+(p.portalEmail||'none')+' → '+(email||'none'));
      if(!changes.length){ render(); return; }
      confirmChange('Save these changes?', null, changes.join('\n'), ()=>{ p.name = name; p.refBy = refVal; p.portalEmail = email; });
    };
  }

  if(ui.modal.type==='collectStatus'){
    const chit = state.chits.find(c=>c.id===ui.modal.chitId);
    const m = chit.members.find(x=>x.id===ui.modal.memberId);
    const mk = ui.modal.monthKey;
    let mode = (m.payModes||{})[mk] || 'cash';
    const modeBtn = (key,label)=>`<button class="btn small ${mode===key?'primary':''}" data-mode="${key}" style="flex:1;padding:10px;">${label}</button>`;
    container.innerHTML = `
      <div class="modal">
        <h3>Collection</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">${escapeHtml(personName(m.personId))} — ${monthLabel(mk)} · ${fmt(monthlyAmount(chit))}</p>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;">Collected by</div>
        <div style="display:flex;gap:8px;margin-bottom:12px;">${modeBtn('cash','Cash')}${modeBtn('upi','UPI')}</div>
        <button class="btn primary" data-collect="paid" style="width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;font-size:14px;">✓ Collected</button>
        <button class="btn" data-collect="late" style="width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;font-size:14px;">L Collected late (settles an earlier due)</button>
        <button class="btn" data-collect="pending" style="width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;font-size:14px;">! Not collected yet</button>
        <p style="font-size:11.5px;color:var(--ink-soft);margin:4px 0 0;">Once collected, only the portal admin can change it.</p>
        <div class="modal-actions"><button class="btn" id="mCancel">Cancel</button></div>
      </div>`;
    document.body.appendChild(container);
    document.getElementById('mCancel').onclick = closeModal;
    document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click', ()=>{
      mode = btn.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('primary', x.dataset.mode===mode));
    }));
    document.querySelectorAll('[data-collect]').forEach(btn=>btn.addEventListener('click', ()=>{
      const v = btn.dataset.collect;
      if(v==='late'){ ui.modal = null; openModal('lateEntry', chit.id, {memberId:m.id, monthKey:mk, mode}); return; }
      if(!m.payModes) m.payModes = {};
      if(m.lateFor) delete m.lateFor[mk];
      if(v==='paid'){ m.payments[mk] = 'paid'; m.payModes[mk] = mode; }
      else { m.payments[mk] = 'pending'; delete m.payModes[mk]; }
      scheduleSave(); ui.modal = null; render();
    }));
  }

  if(ui.modal.type==='refAddPerson'){
    const ref = findRefByPortalEmail(currentUser.email);
    const myChitIds = Array.from(new Set(refMemberRows(ref).map(r=>r.chit.id)));
    const myChits = state.chits.filter(c=>myChitIds.includes(c.id));
    const free = state.people
      .filter(p=>!(p.refBy||'').trim() && !isPlaceholder(p.name) && p.name!=='Kovil (Organization)')
      .sort((a,b)=>a.name.localeCompare(b.name));
    container.innerHTML = `
      <div class="modal">
        <h3>Add person to my group</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">They will be listed under ${escapeHtml(ref.name)}.</p>
        <div class="field"><label>Someone who has no Ref yet</label>
          <select id="raPerson"><option value="">— New person (type the name below) —</option>${free.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select></div>
        <div class="field" id="raNameWrap"><label>New person's name</label><input id="raName" placeholder="Full name"/></div>
        ${myChits.length ? `<div class="field"><label>Enrol in chit group(s)</label>${myChits.map(c=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px;"><input type="checkbox" class="raChit" value="${c.id}"/> ${escapeHtml(chitLabel(c))}</label>`).join('')}</div>` : ''}
        <div id="raErr" style="color:var(--red);font-size:12.5px;min-height:16px;"></div>
        <div class="modal-actions"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mSave">Add to my group</button></div>
      </div>`;
    document.body.appendChild(container);
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('raPerson').addEventListener('change', ()=>{
      document.getElementById('raNameWrap').style.display = document.getElementById('raPerson').value ? 'none' : '';
    });
    document.getElementById('mSave').onclick = ()=>{
      const err = document.getElementById('raErr');
      let personId = document.getElementById('raPerson').value;
      if(!personId){
        const name = (document.getElementById('raName').value||'').trim();
        if(!name){ err.textContent = 'Enter a name, or pick someone from the list.'; return; }
        const existing = state.people.find(p=>nameKey(p.name)===nameKey(name));
        if(existing){
          if((existing.refBy||'').trim() && nameKey(existing.refBy)!==nameKey(ref.name)){
            err.textContent = name+' is already in '+existing.refBy+"'s group — ask the portal admin to move them."; return;
          }
          personId = existing.id;
        } else {
          personId = getOrCreatePerson(name);
        }
      }
      const person = state.people.find(p=>p.id===personId);
      person.refBy = ref.name;
      document.querySelectorAll('.raChit').forEach(cb=>{
        if(!cb.checked) return;
        const chit = state.chits.find(c=>c.id===cb.value);
        if(!chit || chit.members.some(m=>m.personId===personId)) return;
        const archived = (chit.removed||[]).find(r=>r.personId===personId);
        if(archived){ restoreMember(chit, archived.id); return; }
        const sno = chit.members.length ? Math.max(...chit.members.map(m=>m.sno))+1 : 1;
        chit.members.push({id:uid('m'), sno, personId, payments:{}, slots:[], lateFor:{}, payModes:{}});
      });
      scheduleSave(); ui.modal = null; render();
    };
  }

  if(ui.modal.type==='payoutStatus'){
    const chit = state.chits.find(c=>c.id===ui.modal.chitId);
    const m = chit.members.find(x=>x.id===ui.modal.memberId);
    const slot = (m.slots||[]).find(x=>x.id===ui.modal.slotId);
    const mk = addMonths(chit.startMonth, Number(slot.takenChitNo)-1);
    const cur = slot.payoutStatus==='paid' ? (slot.payoutMode||'paid') : '';
    const opt = (key,label)=>`<button class="btn ${cur===key?'primary':''}" data-payset="${key}" style="width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;font-size:14px;">${label}</button>`;
    container.innerHTML = `
      <div class="modal">
        <h3>Chit payout</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">${escapeHtml(personName(m.personId))} — chit ${slot.takenChitNo} · ${monthLabel(mk)} · ${fmt(Number(slot.chitTakenAmount)||0)}</p>
        ${opt('cash','✓ Paid by Cash')}
        ${opt('upi','✓ Paid by UPI')}
        ${(ui.modal.admin || slot.payoutStatus==='paid') ? opt('','✕ Not paid yet') : ''}
        <div class="modal-actions"><button class="btn" id="mCancel">Cancel</button></div>
      </div>`;
    document.body.appendChild(container);
    document.getElementById('mCancel').onclick = closeModal;
    document.querySelectorAll('[data-payset]').forEach(btn=>btn.addEventListener('click', ()=>{
      const v = btn.dataset.payset;
      slot.payoutStatus = v ? 'paid' : '';
      slot.payoutMode = v;
      scheduleSave(); ui.modal = null; render();
    }));
  }

  if(ui.modal.type==='payStatus'){
    const chit = state.chits.find(c=>c.id===ui.modal.chitId);
    const m = chit.members.find(x=>x.id===ui.modal.memberId);
    const mk = ui.modal.monthKey;
    const cur = m.payments[mk] || '';
    let mode = (m.payModes||{})[mk] || '';
    const opt = (key,label)=>`<button class="btn ${cur===key?'primary':''}" data-set="${key}" style="width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;font-size:14px;">${label}</button>`;
    const modeBtn = (key,label)=>`<button class="btn small ${mode===key?'primary':''}" data-mode="${key}" style="flex:1;padding:9px;">${label}</button>`;
    container.innerHTML = `
      <div class="modal">
        <h3>Payment status</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">${escapeHtml(personName(m.personId))} — ${monthLabel(mk)}</p>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;">Paid by (choose first, then tap Paid or Late)</div>
        <div style="display:flex;gap:8px;margin-bottom:12px;">${modeBtn('cash','Cash')}${modeBtn('upi','UPI')}</div>
        ${opt('paid','✓ Paid on time')}
        ${opt('pending','! Pending / unpaid')}
        ${opt('late','L Paid late (settles an earlier due)')}
        ${opt('','✕ Clear mark (not due yet)')}
        <div class="modal-actions"><button class="btn" id="mCancel">Cancel</button></div>
      </div>`;
    document.body.appendChild(container);
    document.getElementById('mCancel').onclick = closeModal;
    document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click', ()=>{
      mode = (mode===btn.dataset.mode) ? '' : btn.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('primary', x.dataset.mode===mode));
    }));
    document.querySelectorAll('[data-set]').forEach(btn=>btn.addEventListener('click', ()=>{
      const v = btn.dataset.set;
      if(v==='late'){ ui.modal = null; openModal('lateEntry', chit.id, {memberId:m.id, monthKey:mk, mode}); return; }
      if(v===''){ delete m.payments[mk]; }
      else { m.payments[mk] = v; }
      if(m.lateFor) delete m.lateFor[mk];
      if(!m.payModes) m.payModes = {};
      if(v==='paid' && mode) m.payModes[mk] = mode; else delete m.payModes[mk];
      scheduleSave(); ui.modal = null; render();
    }));
  }

  if(ui.modal.type==='confirm'){
    container.innerHTML = `
      <div class="modal">
        <h3>${ui.modal.info ? 'Notice' : 'Please confirm'}</h3>
        <p style="white-space:pre-line;font-size:13.5px;line-height:1.5;">${escapeHtml(ui.modal.message)}</p>
        <div class="modal-actions">
          ${ui.modal.info ? '' : `<button class="btn" id="mCancel">${escapeHtml(ui.modal.noLabel)}</button>`}
          <button class="btn primary" id="mSave">${escapeHtml(ui.modal.yesLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(container);
    const yes = ui.modal.onYes, no = ui.modal.onNo;
    const cancelBtn = document.getElementById('mCancel');
    if(cancelBtn) cancelBtn.onclick = ()=>{ ui.modal = null; if(no) no(); render(); };
    document.getElementById('mSave').onclick = ()=>{ ui.modal = null; if(yes) yes(); render(); };
  }

  if(ui.modal.type==='lateEntry'){
    const chit = state.chits.find(c=>c.id===ui.modal.chitId);
    const m = chit.members.find(x=>x.id===ui.modal.memberId);
    const monthKey = ui.modal.monthKey;
    const modeSel = ui.modal.mode || '';
    container.innerHTML = `
      <div class="modal">
        <h3>Late Payment</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">
          ${escapeHtml(personName(m.personId))} is paying <b>${monthLabel(monthKey)}</b>'s collection late. Which month's due does this settle?
        </p>
        <div class="field"><label>Original Due Month</label><input id="fForMonth" type="month" value="${monthKey}"/></div>
        <div class="modal-actions">
          <button class="btn" id="mCancel">Cancel</button>
          <button class="btn primary" id="mSave">Mark as Late-Paid</button>
        </div>
      </div>`;
    document.body.appendChild(container);
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('mSave').onclick = ()=>{
      const forMonth = document.getElementById('fForMonth').value || monthKey;
      m.payments[monthKey] = 'late';
      if(!m.payModes) m.payModes = {};
      if(modeSel) m.payModes[monthKey] = modeSel; else delete m.payModes[monthKey];
      if(!m.lateFor) m.lateFor = {};
      m.lateFor[monthKey] = forMonth;
      // The original due is now settled — clear it if it was still marked pending.
      if(m.payments[forMonth]==='pending') delete m.payments[forMonth];
      scheduleSave();
      ui.modal=null;
      render();
    };
  }

  container.addEventListener('click', (e)=>{ if(e.target===container) closeModal(); });
  document.body.appendChild(container);
}

/* ============================= UTIL ============================= */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ============================= INIT ============================= */
function init(){
  render(); // shows setup/connecting screen immediately
  if(!FIREBASE_CONFIGURED) return;

  onAuthStateChanged(auth, (user)=>{
    authLoading = false;
    if(user){
      currentUser = user;
      subscribeToCloudData();
    } else {
      currentUser = null;
      state = null;
      if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
      if(reminderSubs){ reminderSubs.forEach(u=>u()); reminderSubs = null; }
    }
    render();
  });
}
init();

/* ============================= PWA: SERVICE WORKER ============================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(e=>console.warn('SW registration failed:', e));
  });
}
</script>
</body>
</html>
